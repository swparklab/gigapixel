<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyper Gigapixel Agent · Raking Light</title>
  <link rel="stylesheet" href="/static/theme.css" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
    .hud { position: fixed; top: 16px; left: 16px; right: 16px; z-index: 5; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .panelbox { padding: 9px 13px; border-radius: var(--radius-lg);
      background: color-mix(in srgb, var(--color-surface) 90%, transparent); backdrop-filter: blur(10px);
      border: 1px solid var(--color-border); box-shadow: var(--shadow-md); }
    .panelbox label { display: inline-flex; gap: 8px; align-items: center; margin: 0; font-size: 0.82rem; }
    #status { color: var(--color-text-secondary); font-size: 0.82rem; font-family: var(--font-mono); }
    a.back { color: var(--color-text-primary); text-decoration: none; }
    .spacer { flex: 1; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="hud">
    <div class="panelbox hga-brand">
      <svg class="hga-logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="4.5" stroke="currentColor" stroke-width="1.4"/>
        <path d="M12 5.2v3.1M12 15.7v3.1M5.2 12h3.1M15.7 12h3.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="12" cy="12" r="0.95" fill="currentColor"/>
      </svg>
      <span class="hga-word">Hyper Gigapixel <b>Agent</b></span>
      <span class="hga-sub">Raking Light</span>
    </div>
    <div class="panelbox"><label>Relief <input id="relief" type="range" min="0.2" max="3" step="0.05" value="1.4"></label></div>
    <div class="panelbox"><label>Albedo <input id="albedo" type="range" min="0" max="1" step="0.05" value="0.35"></label></div>
    <div class="panelbox"><span id="status">Move the mouse to rake the light.</span></div>
    <div class="spacer"></div>
    <div class="panelbox"><a class="back" href="/viewer/{{ session_id }}">&larr; Viewer</a></div>
  </div>

  <script>
    const sessionId = "{{ session_id }}";
    const api = `/api/sessions/${sessionId}`;
    const statusEl = document.getElementById("status");
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl");
    let lightX = 0.4, lightY = 0.6;

    const VERT = `attribute vec2 p; varying vec2 uv; void main(){ uv = vec2(p.x*0.5+0.5, 1.0-(p.y*0.5+0.5)); gl_Position = vec4(p,0.0,1.0); }`;
    const FRAG = `precision highp float; varying vec2 uv;
      uniform sampler2D albedo; uniform sampler2D normals; uniform vec3 light; uniform float relief; uniform float amb;
      void main(){
        vec3 c = texture2D(albedo, uv).rgb;
        vec3 n = texture2D(normals, uv).rgb * 2.0 - 1.0;
        n.xy *= relief; n = normalize(n);
        float d = max(dot(n, normalize(light)), 0.0);
        vec3 lit = c * (amb + (1.0 - amb) * d) + vec3(d*d*0.12);
        gl_FragColor = vec4(lit, 1.0);
      }`;

    function compile(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(prog); gl.useProgram(prog);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    const ploc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(ploc);
    gl.vertexAttribPointer(ploc, 2, gl.FLOAT, false, 0, 0);

    function loadTexture(url, unit){
      return new Promise((resolve, reject) => {
        const img = new Image(); img.crossOrigin = "anonymous";
        img.onload = () => {
          // downscale very large images to a safe GL texture size
          const max = 4096; let w = img.width, h = img.height;
          let src = img;
          if (Math.max(w, h) > max) {
            const s = max / Math.max(w, h); const cv = document.createElement("canvas");
            cv.width = Math.round(w*s); cv.height = Math.round(h*s); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); src = cv;
          }
          const tex = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, src);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          resolve({ tex, aspect: img.width / img.height });
        };
        img.onerror = reject; img.src = url;
      });
    }

    function resize(aspect){
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(window.innerWidth * dpr); canvas.height = Math.floor(window.innerHeight * dpr);
      gl.viewport(0,0,canvas.width,canvas.height);
    }
    function draw(){
      gl.uniform3f(gl.getUniformLocation(prog,"light"), (lightX-0.5)*2.0, (0.5-lightY)*2.0, 0.85);
      gl.uniform1f(gl.getUniformLocation(prog,"relief"), Number(document.getElementById("relief").value));
      gl.uniform1f(gl.getUniformLocation(prog,"amb"), Number(document.getElementById("albedo").value));
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    canvas.addEventListener("mousemove", (e) => { lightX = e.clientX/window.innerWidth; lightY = e.clientY/window.innerHeight; draw(); });
    window.addEventListener("resize", () => { resize(); draw(); });
    ["relief","albedo"].forEach(id => document.getElementById(id).addEventListener("input", draw));

    (async () => {
      statusEl.textContent = "Preparing normal map…";
      // ensure the normal map exists
      let normalUrl = `${api}/3d/normal_map.png`;
      const probe = await fetch(normalUrl, { method: "HEAD" }).catch(() => null);
      if (!probe || !probe.ok) {
        await fetch(`${api}/to3d`, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ representation:"normals" }) });
      }
      try {
        gl.uniform1i(gl.getUniformLocation(prog,"albedo"), 0);
        gl.uniform1i(gl.getUniformLocation(prog,"normals"), 1);
        const a = await loadTexture(`${api}/download/optimized`, 0);
        await loadTexture(normalUrl, 1);
        resize(a.aspect); draw();
        statusEl.textContent = "Move the mouse to rake the light · sliders adjust relief/albedo.";
      } catch (e) {
        statusEl.textContent = "Could not load relief textures.";
      }
    })();
  </script>
</body>
</html>
