<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gigapixel Node Workflow</title>
  <link rel="stylesheet" href="https://unpkg.com/litegraph.js@0.7.18/css/litegraph.css" />
  <link rel="stylesheet" href="/static/workflow.css" />
</head>
<body>
  <header class="wf-topbar">
    <div class="wf-brand">
      <h1 id="brandTitle">Gigapixel Node Studio</h1>
      <p id="brandSubtitle">Local Web Agent Workflow</p>
    </div>
    <div class="wf-actions">
      <div class="wf-pref-group">
        <label id="langLabel" for="langSelect">Language</label>
        <select id="langSelect" class="wf-select">
          <option value="ko">한국어</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="wf-pref-group">
        <label id="themeLabel" for="themeSelect">Theme</label>
        <select id="themeSelect" class="wf-select">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
      <a id="classicLink" class="wf-link" href="/classic">Classic UI</a>
      <button id="seedGraphBtn" type="button">Create Seed Graph</button>
      <button id="runGraphBtn" type="button">Run Graph</button>
    </div>
  </header>

  <main class="wf-layout">
    <aside class="wf-sidebar">
      <section class="wf-panel">
        <h2 id="uploadPanelTitle">Upload Batch</h2>
        <input id="nodeFiles" type="file" multiple accept="image/*" />
        <button id="uploadBatchBtn" type="button">Upload Batch</button>
        <select id="uploadSelect"></select>
      </section>

      <section class="wf-panel">
        <h2 id="libraryPanelTitle">Function Library</h2>
        <ul id="libraryList"></ul>
      </section>

      <section class="wf-panel">
        <h2 id="statusPanelTitle">Status</h2>
        <p id="socketStatus">connecting...</p>
        <div id="runSummary"></div>
      </section>

      <section class="wf-panel">
        <h2 id="eventsPanelTitle">Events</h2>
        <pre id="eventLog"></pre>
      </section>
    </aside>

    <section class="wf-canvas-wrap">
      <canvas id="graphCanvas"></canvas>
    </section>
  </main>

  <script src="https://unpkg.com/litegraph.js@0.7.18/build/litegraph.js"></script>
  <script src="/static/ui-prefs.js"></script>
  <script src="/static/workflow.js"></script>
</body>
</html>
