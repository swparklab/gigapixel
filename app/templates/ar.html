<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyper Gigapixel Agent · AR / XR</title>
  <link rel="stylesheet" href="/static/theme.css" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    model-viewer { position: fixed; inset: 0; width: 100%; height: 100%; }
    .hud { position: fixed; top: 16px; left: 16px; right: 16px; z-index: 5; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .panelbox { padding: 9px 13px; border-radius: var(--radius-lg);
      background: color-mix(in srgb, var(--color-surface) 90%, transparent); backdrop-filter: blur(10px);
      border: 1px solid var(--color-border); box-shadow: var(--shadow-md); }
    .panelbox button { width: auto; min-height: 0; padding: 8px 14px; border-radius: var(--radius-md);
      border: 1px solid var(--accent); background: var(--accent); color: var(--color-on-primary); font-weight: 600; cursor: pointer; }
    #status { color: var(--color-text-secondary); font-size: .84rem; font-family: var(--font-mono); }
    a.back { color: var(--color-text-primary); text-decoration: none; }
    .spacer { flex: 1; }
  </style>
  <script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>
  <model-viewer id="mv" camera-controls auto-rotate ar ar-modes="webxr scene-viewer quick-look"
                shadow-intensity="0.8" exposure="1.0" touch-action="pan-y"></model-viewer>
  <div class="hud">
    <div class="panelbox hga-brand">
      <svg class="hga-logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="4.5" stroke="currentColor" stroke-width="1.4"/>
        <path d="M12 5.2v3.1M12 15.7v3.1M5.2 12h3.1M15.7 12h3.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="12" r="0.95" fill="currentColor"/>
      </svg>
      <span class="hga-word">Hyper Gigapixel <b>Agent</b></span><span class="hga-sub">AR / XR</span>
    </div>
    <div class="panelbox"><button id="buildBtn">Build mesh</button></div>
    <div class="panelbox"><span id="status">Loading 3D model…</span></div>
    <div class="spacer"></div>
    <div class="panelbox"><a class="back" href="/viewer/{{ session_id }}">&larr; Viewer</a></div>
  </div>
  <script>
    const sessionId = "{{ session_id }}";
    const api = `/api/sessions/${sessionId}`;
    const mv = document.getElementById("mv");
    const statusEl = document.getElementById("status");
    const glb = `${api}/3d/mesh.glb`;

    async function load() {
      const probe = await fetch(glb, { method: "HEAD" }).catch(() => null);
      if (probe && probe.ok) { mv.src = glb; statusEl.textContent = "Drag to orbit · tap the AR button on a phone."; }
      else statusEl.textContent = "No GLB yet — click “Build mesh”.";
    }
    document.getElementById("buildBtn").addEventListener("click", async () => {
      statusEl.textContent = "Building textured mesh…";
      try { await fetch(`${api}/to3d`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ representation: "mesh" }) }); load(); }
      catch (e) { statusEl.textContent = "Build failed."; }
    });
    mv.addEventListener("error", () => statusEl.textContent = "GLB needs the optional 'trimesh' package on the server.");
    load();
  </script>
</body>
</html>
