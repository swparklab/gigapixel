<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session Viewer</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/5.0.1/openseadragon.min.js"></script>
</head>
<body>
  <main class="viewer-layout">
    <section class="sidebar">
      <section class="prefs-bar">
        <div class="prefs-group">
          <label id="langLabel" for="langSelect">Language</label>
          <select id="langSelect">
            <option value="ko">한국어</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="prefs-group">
          <label id="themeLabel" for="themeSelect">Theme</label>
          <select id="themeSelect">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
      </section>

      <h2 id="sessionHeading">Session</h2>
      <p id="meta"></p>
      <button id="refreshBtn">Refresh Status</button>
      <button id="downloadRawBtn" disabled>Download Raw High-Res</button>
      <button id="downloadOptimizedBtn" disabled>Download Optimized</button>
      <button id="newSessionBtn" type="button" class="secondary">New Session</button>

      <hr />
      <h3 id="annotationHeading">Annotation</h3>
      <p id="annotationGuide">Click in viewer to pick coordinates, then write your note.</p>
      <div class="annotation-form">
        <input id="annText" type="text" placeholder="annotation text" />
        <button id="saveAnnBtn">Save</button>
      </div>
      <ul id="annList"></ul>
    </section>

    <section class="viewer-panel">
      <div id="openseadragon" class="viewer"></div>
    </section>
  </main>

  <script>window.__SESSION_ID__ = "{{ session_id }}";</script>
  <script src="/static/ui-prefs.js"></script>
  <script src="/static/viewer.js"></script>
</body>
</html>
