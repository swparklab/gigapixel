<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyper Gigapixel Agent</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="/static/theme.css" />
</head>
<body>
  <main class="container">
    <section class="topbar">
      <div class="hga-brand">
        <svg class="hga-logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="4.5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M12 5.2v3.1M12 15.7v3.1M5.2 12h3.1M15.7 12h3.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="12" cy="12" r="0.95" fill="currentColor"/>
        </svg>
        <span class="hga-word">Hyper Gigapixel <b>Agent</b></span>
        <span class="hga-sub">Heritage Imaging</span>
      </div>
      <section class="prefs-bar">
        <div class="prefs-group">
          <label id="langLabel" for="langSelect">Language</label>
          <select id="langSelect">
            <option value="ko">&#54620;&#44397;&#50612;</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="prefs-group">
          <label id="themeLabel" for="themeSelect">Theme</label>
          <select id="themeSelect">
            <option value="light">Light</option>
            <option value="dark">Night</option>
          </select>
        </div>
      </section>

      <a id="openWorkflowLink" class="mode-link" href="/workflow">Expert Mode</a>
    </section>

    <h1 id="pageTitle">Hyper Gigapixel Agent</h1>
    <p id="pageSubtitle">Upload multiple images and run stitching, DZI generation, and viewer sharing in one flow.</p>

    <section class="panel">
      <label id="sessionNameLabel" for="sessionName">Session Name</label>
      <input id="sessionName" type="text" placeholder="e.g. Gyeongbokgung 1910 Scan" autocomplete="off" />

      <label id="filesLabel" for="files">Image Files (at least 2)</label>
      <input id="files" type="file" multiple accept="image/*" />

      <label id="stitchModeLabel" for="stitchMode">Stitch Mode</label>
      <select id="stitchMode">
        <option id="stitchModeScans" value="scans">scans (recommended for flat/document scans)</option>
        <option id="stitchModePanorama" value="panorama">panorama (recommended for scene panoramas)</option>
      </select>

      <button id="startBtn" aria-describedby="status">Create Session and Start Processing</button>
      <button id="nextBtn" type="button" class="secondary hidden">Prepare Next Output</button>
      <p id="status" role="status" aria-live="polite"></p>
      <p id="share" aria-live="polite"></p>
    </section>

    <section class="panel planner-panel" aria-labelledby="plannerTitle">
      <div class="planner-head">
        <div>
          <h2 id="plannerTitle">Acquisition Planner</h2>
          <p id="plannerSubtitle">Canon R8 capture count, overlap, focus stacking, and battery estimate.</p>
        </div>
        <span id="plannerBadge" class="planner-badge">R8 6000 x 4000</span>
      </div>

      <div class="planner-grid">
        <label id="cameraWidthLabel" for="cameraWidth">Camera Width</label>
        <input id="cameraWidth" type="number" min="1" value="6000" inputmode="numeric" />

        <label id="cameraHeightLabel" for="cameraHeight">Camera Height</label>
        <input id="cameraHeight" type="number" min="1" value="4000" inputmode="numeric" />

        <label id="targetWidthLabel" for="targetWidth">Target Width</label>
        <input id="targetWidth" type="number" min="1" value="30000" inputmode="numeric" />

        <label id="targetHeightLabel" for="targetHeight">Target Height</label>
        <input id="targetHeight" type="number" min="1" value="30000" inputmode="numeric" />

        <label id="overlapLabel" for="overlapPercent">Overlap (%)</label>
        <input id="overlapPercent" type="number" min="0" max="99" step="1" value="80" inputmode="decimal" />

        <label id="focusStackLabel" for="focusStackShots">Focus Stack Shots</label>
        <input id="focusStackShots" type="number" min="1" value="6" inputmode="numeric" />

        <label id="batteryLabel" for="safeShotsPerBattery">Safe Shots / Battery</label>
        <input id="safeShotsPerBattery" type="number" min="1" value="250" inputmode="numeric" />
      </div>

      <button id="calculatePlanBtn" type="button" class="secondary">Calculate Capture Plan</button>
      <div id="plannerResult" class="planner-result" aria-live="polite"></div>
    </section>
  </main>

  <script src="/static/ui-prefs.js"></script>
  <script src="/static/index.js"></script>
</body>
</html>
