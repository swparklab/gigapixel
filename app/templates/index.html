<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gigapixel Heritage Viewer</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="container">
    <section class="topbar">
      <section class="prefs-bar">
        <div class="prefs-group">
          <label id="langLabel" for="langSelect">Language</label>
          <select id="langSelect">
            <option value="ko">&#54620;&#44397;&#50612;</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="prefs-group">
          <label id="themeLabel" for="themeSelect">Theme</label>
          <select id="themeSelect">
            <option value="light">Light</option>
            <option value="dark">Night</option>
          </select>
        </div>
      </section>

      <a id="openWorkflowLink" class="mode-link" href="/workflow">Expert Mode</a>
    </section>

    <h1 id="pageTitle">Gigapixel Heritage Viewer</h1>
    <p id="pageSubtitle">Upload multiple images and run stitching, DZI generation, and viewer sharing in one flow.</p>

    <section class="panel">
      <label id="sessionNameLabel" for="sessionName">Session Name</label>
      <input id="sessionName" type="text" placeholder="e.g. Gyeongbokgung 1910 Scan" />

      <label id="filesLabel" for="files">Image Files (at least 2)</label>
      <input id="files" type="file" multiple accept="image/*" />

      <label id="stitchModeLabel" for="stitchMode">Stitch Mode</label>
      <select id="stitchMode">
        <option id="stitchModeScans" value="scans">scans (recommended for flat/document scans)</option>
        <option id="stitchModePanorama" value="panorama">panorama (recommended for scene panoramas)</option>
      </select>

      <button id="startBtn">Create Session and Start Processing</button>
      <button id="nextBtn" type="button" class="secondary hidden">Prepare Next Output</button>
      <p id="status"></p>
      <p id="share"></p>
    </section>
  </main>

  <script src="/static/ui-prefs.js"></script>
  <script src="/static/index.js"></script>
</body>
</html>
