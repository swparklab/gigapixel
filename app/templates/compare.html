<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyper Gigapixel Agent · Restore</title>
  <link rel="stylesheet" href="/static/theme.css" />
  <style>
    body { margin: 0; min-height: 100vh; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 22px 18px 60px; }
    .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
    .bar button, .bar a {
      padding: 9px 16px; border-radius: var(--radius-md); cursor: pointer; border: 1px solid var(--accent);
      text-decoration: none; font-weight: 600;
      color: var(--color-on-primary); background: var(--accent);
    }
    .bar button:hover, .bar a:hover { background: var(--accent-hover); }
    .bar a.ghost { background: var(--color-surface-elevated); color: var(--color-text-primary); border: 1px solid var(--color-border-strong); }
    .bar a.ghost:hover { border-color: var(--accent); color: var(--accent); }
    .compare {
      position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: var(--radius-xl); overflow: hidden;
      border: 1px solid var(--color-border); box-shadow: var(--shadow-lg); background: var(--viewer-bg);
      user-select: none; touch-action: none;
    }
    .compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .compare .after { clip-path: inset(0 0 0 var(--split, 50%)); }
    .handle {
      position: absolute; top: 0; bottom: 0; left: var(--split, 50%); width: 2px;
      background: var(--accent); transform: translateX(-1px);
    }
    .handle::after {
      content: "‹ ›"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: var(--color-surface-elevated); color: var(--color-text-primary);
      border: 1px solid var(--color-border-strong); border-radius: 999px; padding: 4px 10px; font-size: 0.9rem;
    }
    .tag { position: absolute; top: 12px; padding: 4px 12px; border-radius: 999px; font-size: 0.8rem;
      background: rgba(0,0,0,0.45); color: #fff; backdrop-filter: blur(6px); }
    .tag.l { left: 12px; } .tag.r { right: 12px; }
    #status { color: var(--color-text-secondary); font-size: 0.85rem; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="bar">
      <div class="hga-brand">
        <svg class="hga-logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="4.5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M12 5.2v3.1M12 15.7v3.1M5.2 12h3.1M15.7 12h3.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="12" cy="12" r="0.95" fill="currentColor"/>
        </svg>
        <span class="hga-word">Hyper Gigapixel <b>Agent</b></span>
        <span class="hga-sub">Restore</span>
      </div>
      <button id="runBtn">Run AI Restore</button>
      <a class="ghost" href="/viewer/{{ session_id }}">&larr; Viewer</a>
      <span id="status"></span>
    </div>
    <div class="compare" id="compare">
      <img class="before" id="beforeImg" alt="before" />
      <img class="after" id="afterImg" alt="after" />
      <div class="handle" id="handle"></div>
      <span class="tag l">BEFORE</span>
      <span class="tag r">AFTER · RESTORED</span>
    </div>
  </main>

  <script>
    const sessionId = "{{ session_id }}";
    const statusEl = document.getElementById("status");
    const before = document.getElementById("beforeImg");
    const after = document.getElementById("afterImg");
    const compare = document.getElementById("compare");
    const handle = document.getElementById("handle");

    before.src = `/api/sessions/${sessionId}/download/optimized`;

    function loadAfter() {
      after.src = `/api/sessions/${sessionId}/download/restored?t=${Date.now()}`;
      after.onerror = () => { statusEl.textContent = "No restored image yet — click Run AI Restore."; };
      after.onload = () => { statusEl.textContent = "Drag the divider to compare."; };
    }

    function setSplit(clientX) {
      const rect = compare.getBoundingClientRect();
      let pct = ((clientX - rect.left) / rect.width) * 100;
      pct = Math.max(0, Math.min(100, pct));
      compare.style.setProperty("--split", pct + "%");
    }
    let dragging = false;
    compare.addEventListener("pointerdown", (e) => { dragging = true; setSplit(e.clientX); });
    window.addEventListener("pointermove", (e) => { if (dragging) setSplit(e.clientX); });
    window.addEventListener("pointerup", () => { dragging = false; });

    document.getElementById("runBtn").addEventListener("click", async () => {
      statusEl.textContent = "Restoring (de-colour · de-crack · de-noise)…";
      try {
        const res = await fetch(`/api/sessions/${sessionId}/restore`, { method: "POST" });
        const data = await res.json();
        statusEl.textContent = "Restored: " + (data.actions || []).join(" · ");
        loadAfter();
      } catch (e) {
        statusEl.textContent = "Restore failed.";
      }
    });

    loadAfter();
  </script>
</body>
</html>
